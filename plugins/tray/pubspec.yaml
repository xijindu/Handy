name: tray
description: System tray integration for Handy on macOS and Windows.
version: 0.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: TrayPlugin
      windows:
        pluginClass: TrayPluginCApi
